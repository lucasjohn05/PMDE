# Grafana-managed alerting for PMDE, exported from the Grafana Cloud stack
# (provisioning file format): the "pmde" rule group in folder PMDE, the
# pmde-email and pmde-bad-maker-email contact points, and the Dec 9 2026
# FOMC mute timing.
#
# Created through the provisioning API with X-Disable-Provenance, so it
# stays editable in the Grafana UI. Edits made there aren't reflected here
# until re-exported. See docs/reference.md, "Monitoring".
#
# <ALERT_EMAIL> is a placeholder: the real address is set only in
# Grafana, and must belong to a member of the Grafana org.
apiVersion: 1
groups:
    - orgId: 1
      name: pmde
      folder: PMDE
      interval: 1m
      rules:
        - uid: pmde-metrics-absent
          title: pmde metrics absent
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: absent(up{job="pmde"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            description: 'up{job="pmde"} has no samples: pmde, Alloy or the droplet is down, or remote_write is failing.'
            summary: No pmde metrics reaching Grafana Cloud
          labels:
            service: pmde
            severity: critical
          isPaused: false
          notification_settings:
            receiver: pmde-email
        - uid: pmde-book-stale
          title: pmde book stale
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: (book_stale{job="pmde"} == 1) unless on (venue, market) (market_resolved{job="pmde"} == 1)
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 2m
          annotations:
            description: The book has been untrusted for over 2 minutes and the market isn't marked resolved.
            summary: 'Stale book: {{ $labels.venue }} {{ $labels.outcome }} ({{ $labels.pair }})'
          labels:
            service: pmde
            severity: warning
          isPaused: false
          notification_settings:
            receiver: pmde-email
            mute_time_intervals:
                - fomc-2026-12-09-decision
        - uid: pmde-drop-rate
          title: pmde sustained message drops
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: sum by (venue, market, pair, outcome) (rate(dropped_messages_total{job="pmde"}[5m])) * 60 > 1
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 10m
          annotations:
            description: The websocket reader has dropped more than 1 message/min for 10 minutes (queue full), forcing repeated resyncs.
            summary: 'Dropping messages: {{ $labels.venue }} {{ $labels.outcome }} ({{ $labels.pair }})'
          labels:
            service: pmde
            severity: warning
          isPaused: false
          notification_settings:
            receiver: pmde-email
        - uid: pmde-storage-blocked
          title: pmde storage blocked
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: rate(storage_blocked_seconds_total{job="pmde"}[5m]) > 0.01
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            description: Book goroutines spent more than 1% of the time blocked on the storage writer for 5 minutes (slow disk?).
            summary: pmde storage writer is holding up the books
          labels:
            service: pmde
            severity: warning
          isPaused: false
          notification_settings:
            receiver: pmde-email
        - uid: pmde-reconnect-rate
          title: pmde reconnect rate
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: sum by (venue, market, pair, outcome) (increase(reconnects_total{job="pmde"}[1h])) > 10
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 15m
          annotations:
            description: More than 10 reconnects in the last hour, for 15 minutes. Normal is under 1/h.
            summary: 'Reconnecting often: {{ $labels.venue }} {{ $labels.outcome }} ({{ $labels.pair }})'
          labels:
            service: pmde
            severity: warning
          isPaused: false
          notification_settings:
            receiver: pmde-email
        - uid: pmde-disk-low
          title: pmde droplet disk low
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: (node_filesystem_avail_bytes{job="integrations/node_exporter", instance="pmde-nyc1", mountpoint="/"} / node_filesystem_size_bytes{job="integrations/node_exporter", instance="pmde-nyc1", mountpoint="/"}) < 0.15
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 15m
          annotations:
            description: node_filesystem_avail_bytes on / is under 15% of its size.
            summary: Droplet root disk under 15% free
          labels:
            service: pmde
            severity: warning
          isPaused: false
          notification_settings:
            receiver: pmde-email
        - uid: pmde-new-series-quoted
          title: New Kalshi series quoted
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: opens_new_series_quoted{job="pmde-scan"}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          keepFiringFor: 15m
          annotations:
            description: '{{ $labels.market }}: bid {{ $labels.bid }} x {{ $labels.bid_size }}, ask {{ $labels.ask }} x {{ $labels.ask_size }} contracts, spread {{ $labels.spread_bps }} bps. The series'' first two-sided quote under the quote rule within its first 14 days.'
            summary: 'New series quoted: {{ $labels.series }} ({{ $labels.title }})'
          labels:
            service: pmde
            severity: info
          isPaused: false
          notification_settings:
            receiver: pmde-email
            group_by:
                - alertname
                - series
            repeat_interval: 30d
        - uid: pmde-bad-maker
          title: Kalshi bad-maker candidate
          condition: Z
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: opens_bad_maker_alert_until_timestamp_seconds{job="pmde-scan"} - time()
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="quoted_share"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: B
            - refId: C
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="median_capacity"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: C
            - refId: D
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="combo_share"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: D
            - refId: E
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="combo_bid_size"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: E
            - refId: F
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="combo_ask_size"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: F
            - refId: G
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="combo_spread_bps"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: G
            - refId: H
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="settled_events"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: H
            - refId: I
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="net_edge_bps"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: I
            - refId: J
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="net_edge_lo_bps"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: J
            - refId: K
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="wing_against"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: K
            - refId: L
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="wing_expected"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: L
            - refId: M
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="wing_hi"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: M
            - refId: "N"
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="capture_opens"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: "N"
            - refId: O
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="wing_events"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: O
            - refId: Z
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: Z
                type: threshold
          noDataState: OK
          execErrState: Error
          keepFiringFor: 15m
          annotations:
            description: |-
                {{ $labels.series }}: {{ $labels.title }}
                Rule ({{ $labels.thresholds }}), over the last window:
                1. Qualifying two-sided quote on {{ humanizePercentage $values.B.Value }} of {{ printf "%.0f" $values.N.Value }} captured opens.
                2. Median daily capacity {{ printf "%.0f" $values.C.Value }} contracts.
                3. One quote, {{ printf "%g" $values.E.Value }} x {{ printf "%g" $values.F.Value }} contracts {{ printf "%.0f" $values.G.Value }} bps wide, on {{ humanizePercentage $values.D.Value }} of opening quotes.
                4. {{ printf "%.0f" $values.H.Value }} settled events.
                5. Net edge {{ printf "%.0f" $values.I.Value }} bps, lower bound {{ printf "%.0f" $values.J.Value }} bps. Wing rungs settling against their opening price: {{ printf "%.0f" $values.K.Value }} against {{ printf "%.1f" $values.L.Value }} expected (interval top {{ printf "%.1f" $values.M.Value }}, {{ printf "%.0f" $values.O.Value }} events).
            summary: 'Bad-maker candidate: {{ $labels.series }} ({{ $labels.title }}), {{ printf "%.0f" $values.H.Value }} events'
          labels:
            service: pmde
            severity: info
          isPaused: false
          notification_settings:
            receiver: pmde-bad-maker-email
            group_by:
                - alertname
                - series
            repeat_interval: 30d
contactPoints:
    - orgId: 1
      name: pmde-email
      receivers:
        - uid: pmde-email
          type: email
          settings:
            addresses: <ALERT_EMAIL>
            singleEmail: true
          disableResolveMessage: false
    - orgId: 1
      name: pmde-bad-maker-email
      receivers:
        - uid: pmde-bad-maker-email
          type: email
          settings:
            addresses: <ALERT_EMAIL>
            singleEmail: true
          disableResolveMessage: true
muteTimes:
    - orgId: 1
      name: fomc-2026-12-09-decision
      time_intervals:
        - times:
            - start_time: "13:58"
              end_time: "24:00"
          days_of_month: ["9"]
          months: ["12"]
          years: ["2026"]
          location: America/New_York
        - {times: [{start_time: "00:00", end_time: "12:00"}], days_of_month: ["10"], months: ["12"], years: ["2026"], location: America/New_York}
