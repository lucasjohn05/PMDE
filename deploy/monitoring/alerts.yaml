              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="net_edge_bps"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: I
            - refId: J
              relativeTimeRange:
                from: 600
