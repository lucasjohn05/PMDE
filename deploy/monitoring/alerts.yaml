                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max(gas_paper_ledger{job="integrations/node_exporter", ledger="bid95", stat="pnl_dollars"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: L15
            - refId: L20
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max(gas_paper_ledger{job="integrations/node_exporter", ledger="mid3050", stat="continues"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
