            - refId: L21
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max(gas_paper_ledger{job="integrations/node_exporter", ledger="mid3050", stat="edge_cents"})
                instant: true
                intervalMs: 1000
