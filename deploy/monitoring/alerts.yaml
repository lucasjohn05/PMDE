                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max(gas_paper_ledger{job="integrations/node_exporter", ledger="model", stat="upper_cents"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: L03
            - refId: L04
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max(gas_paper_ledger{job="integrations/node_exporter", ledger="model", stat="contracts"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: L04
            - refId: L05
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max(gas_paper_ledger{job="integrations/node_exporter", ledger="model", stat="pnl_dollars"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: L05
            - refId: L10
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max(gas_paper_ledger{job="integrations/node_exporter", ledger="bid95", stat="continues"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: L10
            - refId: L11
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max(gas_paper_ledger{job="integrations/node_exporter", ledger="bid95", stat="edge_cents"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: L11
            - refId: L12
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max(gas_paper_ledger{job="integrations/node_exporter", ledger="bid95", stat="lower_cents"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: L12
            - refId: L13
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max(gas_paper_ledger{job="integrations/node_exporter", ledger="bid95", stat="upper_cents"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: L13
            - refId: L14
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max(gas_paper_ledger{job="integrations/node_exporter", ledger="bid95", stat="contracts"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: L14
            - refId: L15
              relativeTimeRange:
