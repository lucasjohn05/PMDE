                range: false
                refId: L21
            - refId: L22
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max(gas_paper_ledger{job="integrations/node_exporter", ledger="mid3050", stat="lower_cents"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: L22
            - refId: L23
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max(gas_paper_ledger{job="integrations/node_exporter", ledger="mid3050", stat="upper_cents"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: L23
            - refId: L24
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max(gas_paper_ledger{job="integrations/node_exporter", ledger="mid3050", stat="contracts"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: L24
            - refId: L25
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max(gas_paper_ledger{job="integrations/node_exporter", ledger="mid3050", stat="pnl_dollars"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: L25
            - refId: Z
              datasourceUid: __expr__
              model:
