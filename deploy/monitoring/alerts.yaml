                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          keepFiringFor: 15m
          annotations:
            description: '{{ $labels.market }}: bid {{ $labels.bid }} x {{ $labels.bid_size }}, ask {{ $labels.ask }} x {{ $labels.ask_size }} contracts, spread {{ $labels.spread_bps }} bps. The series'' first two-sided quote under the quote rule within its first 14 days.'
            summary: 'New series quoted: {{ $labels.series }} ({{ $labels.title }})'
          labels:
            service: pmde
            severity: info
          isPaused: false
          notification_settings:
            receiver: pmde-email
            group_by:
                - alertname
                - series
            repeat_interval: 30d
