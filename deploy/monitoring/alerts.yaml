              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="wing_expected"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: L
            - refId: M
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="wing_hi"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: M
            - refId: "N"
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="capture_opens"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: "N"
            - refId: O
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="wing_events"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: O
            - refId: P
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="window_notional_per_day"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: P
            - refId: Q
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="life_notional_per_day"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: Q
            - refId: R
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="quoters"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: R
            - refId: S
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="top_quoter_share"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: S
            - refId: T
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="screen_candidate"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: T
            - refId: Z
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: Z
                type: threshold
          noDataState: OK
          execErrState: Error
          keepFiringFor: 15m
          annotations:
            description: |-
                {{ $labels.series }}: {{ $labels.title }}
                Rule ({{ $labels.thresholds }}), over the last window:
                1. Qualifying two-sided quote on {{ humanizePercentage $values.B.Value }} of {{ printf "%.0f" $values.N.Value }} captured opens.
                2. Median daily capacity {{ printf "%.0f" $values.C.Value }} contracts.
                3. One quote, {{ printf "%g" $values.E.Value }} x {{ printf "%g" $values.F.Value }} contracts {{ printf "%.0f" $values.G.Value }} bps wide, on {{ humanizePercentage $values.D.Value }} of opening quotes.
                4. {{ printf "%.0f" $values.H.Value }} settled events.
                5. Net edge {{ printf "%.0f" $values.I.Value }} bps, lower bound {{ printf "%.0f" $values.J.Value }} bps. Wing rungs settling against their opening price: {{ printf "%.0f" $values.K.Value }} against {{ printf "%.1f" $values.L.Value }} expected (interval top {{ printf "%.1f" $values.M.Value }}, {{ printf "%.0f" $values.O.Value }} events).
                Context (not conditions): window notional {{ if lt $values.P.Value 0.0 }}unknown{{ else }}${{ printf "%.0f" $values.P.Value }}/day{{ end }}, life notional {{ if lt $values.Q.Value 0.0 }}unknown{{ else }}${{ printf "%.0f" $values.Q.Value }}/day{{ end }}; quoters {{ if lt $values.R.Value 0.0 }}unknown (never captured){{ else }}{{ printf "%.0f" $values.R.Value }}, largest {{ humanizePercentage $values.S.Value }} of quoted size{{ end }}; screening band: {{ if eq $values.T.Value 1.0 }}candidate{{ else }}not a candidate{{ end }}.
            summary: 'Bad-maker candidate: {{ $labels.series }} ({{ $labels.title }}), {{ printf "%.0f" $values.H.Value }} events'
          labels:
            service: pmde
            severity: info
          isPaused: false
          notification_settings:
            receiver: pmde-bad-maker-email
            group_by:
                - alertname
                - series
            repeat_interval: 30d
        - uid: gas-paper-verdict
          title: 'Gas paper trading: 30-day verdict'
          condition: Z
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max(gas_paper_verdict_until_timestamp_seconds{job="integrations/node_exporter"}) - time()
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: D
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max(gas_paper_days_settled{job="integrations/node_exporter"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: D
            - refId: L00
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max(gas_paper_ledger{job="integrations/node_exporter", ledger="model", stat="continues"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: L00
            - refId: L01
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max(gas_paper_ledger{job="integrations/node_exporter", ledger="model", stat="edge_cents"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: L01
            - refId: L02
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
