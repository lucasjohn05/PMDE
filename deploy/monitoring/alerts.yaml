                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: Z
                type: threshold
          noDataState: OK
          execErrState: Error
          annotations:
            description: |-
                Gas paper trading: verdict after {{ printf "%.0f" $values.D.Value }} settled event days.
                Rule: a ledger continues only if its mean realized edge per contract is above zero and the lower bound of its 90% bootstrap-by-day interval is above zero.

                model: {{ if eq $values.L00.Value 1.0 }}CONTINUES{{ else }}STOPPED{{ end }}. Edge {{ printf "%+.1f" $values.L01.Value }}c per contract, interval [{{ printf "%+.1f" $values.L02.Value }}c, {{ printf "%+.1f" $values.L03.Value }}c], {{ printf "%.0f" $values.L04.Value }} contracts, P&L ${{ printf "%+.2f" $values.L05.Value }}.
                bid95: {{ if eq $values.L10.Value 1.0 }}CONTINUES{{ else }}STOPPED{{ end }}. Edge {{ printf "%+.1f" $values.L11.Value }}c per contract, interval [{{ printf "%+.1f" $values.L12.Value }}c, {{ printf "%+.1f" $values.L13.Value }}c], {{ printf "%.0f" $values.L14.Value }} contracts, P&L ${{ printf "%+.2f" $values.L15.Value }}.
                mid3050: {{ if eq $values.L20.Value 1.0 }}CONTINUES{{ else }}STOPPED{{ end }}. Edge {{ printf "%+.1f" $values.L21.Value }}c per contract, interval [{{ printf "%+.1f" $values.L22.Value }}c, {{ printf "%+.1f" $values.L23.Value }}c], {{ printf "%.0f" $values.L24.Value }} contracts, P&L ${{ printf "%+.2f" $values.L25.Value }}.

                Detail: ssh to the droplet, cat /opt/gas/reports/paper.md
            summary: 'Gas paper trading: the 30-day verdict is in'
          labels:
            service: gas-paper
            severity: info
          isPaused: false
          notification_settings:
            receiver: pmde-bad-maker-email
            group_by:
                - alertname
            repeat_interval: 30d
        - uid: pmde-book-stale
          title: pmde book stale
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: (book_stale{job="pmde"} == 1) unless on (venue, market) (market_resolved{job="pmde"} == 1)
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 2m
          annotations:
            description: The book has been untrusted for over 2 minutes and the market isn't marked resolved.
            summary: 'Stale book: {{ $labels.venue }} {{ $labels.outcome }} ({{ $labels.pair }})'
          labels:
            service: pmde
            severity: warning
          isPaused: false
          notification_settings:
            receiver: pmde-email
            mute_time_intervals:
                - fomc-2026-12-09-decision
        - uid: pmde-drop-rate
          title: pmde sustained message drops
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: sum by (venue, market, pair, outcome) (rate(dropped_messages_total{job="pmde"}[5m])) * 60 > 1
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 10m
          annotations:
            description: The websocket reader has dropped more than 1 message/min for 10 minutes (queue full), forcing repeated resyncs.
            summary: 'Dropping messages: {{ $labels.venue }} {{ $labels.outcome }} ({{ $labels.pair }})'
          labels:
            service: pmde
            severity: warning
          isPaused: false
          notification_settings:
            receiver: pmde-email
        - uid: pmde-storage-blocked
          title: pmde storage blocked
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: rate(storage_blocked_seconds_total{job="pmde"}[5m]) > 0.01
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            description: Book goroutines spent more than 1% of the time blocked on the storage writer for 5 minutes (slow disk?).
            summary: pmde storage writer is holding up the books
          labels:
            service: pmde
            severity: warning
          isPaused: false
          notification_settings:
            receiver: pmde-email
        - uid: pmde-reconnect-rate
          title: pmde reconnect rate
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: sum by (venue, market, pair, outcome) (increase(reconnects_total{job="pmde"}[1h])) > 10
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 15m
          annotations:
            description: More than 10 reconnects in the last hour, for 15 minutes. Normal is under 1/h.
            summary: 'Reconnecting often: {{ $labels.venue }} {{ $labels.outcome }} ({{ $labels.pair }})'
          labels:
            service: pmde
            severity: warning
          isPaused: false
          notification_settings:
            receiver: pmde-email
        - uid: pmde-disk-low
          title: pmde droplet disk low
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: (node_filesystem_avail_bytes{job="integrations/node_exporter", instance="pmde-nyc1", mountpoint="/"} / node_filesystem_size_bytes{job="integrations/node_exporter", instance="pmde-nyc1", mountpoint="/"}) < 0.15
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 15m
          annotations:
            description: node_filesystem_avail_bytes on / is under 15% of its size.
            summary: Droplet root disk under 15% free
          labels:
            service: pmde
            severity: warning
          isPaused: false
          notification_settings:
            receiver: pmde-email
        - uid: pmde-new-series-quoted
