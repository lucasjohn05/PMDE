# Grafana-managed alerting for PMDE, exported from the Grafana Cloud stack
# (provisioning file format): the "pmde" rule group in folder PMDE (with
# the gas paper trader's verdict rule, gas-paper-verdict), the
# pmde-email and pmde-bad-maker-email contact points, and the Dec 9 2026
# FOMC mute timing.
#
# Created through the provisioning API with X-Disable-Provenance, so it
# stays editable in the Grafana UI. Edits made there aren't reflected here
# until re-exported. See docs/reference.md, "Monitoring".
#
# <ALERT_EMAIL> is a placeholder: the real address is set only in
# Grafana, and must belong to a member of the Grafana org.
apiVersion: 1
groups:
    - orgId: 1
      name: pmde
      folder: ""
      interval: 1m
      rules:
        - uid: pmde-metrics-absent
          title: pmde metrics absent
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: absent(up{job="pmde"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            description: 'up{job="pmde"} has no samples: pmde, Alloy or the droplet is down, or remote_write is failing.'
            summary: No pmde metrics reaching Grafana Cloud
          labels:
            service: pmde
            severity: critical
          isPaused: false
          notification_settings:
            receiver: pmde-email
        - uid: pmde-bad-maker
          title: Kalshi bad-maker candidate
          condition: Z
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: opens_bad_maker_alert_until_timestamp_seconds{job="pmde-scan"} - time()
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="quoted_share"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: B
            - refId: C
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="median_capacity"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: C
            - refId: D
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="combo_share"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: D
            - refId: E
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="combo_bid_size"})
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: E
            - refId: F
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                expr: max without (stat) (opens_bad_maker_stat{job="pmde-scan", stat="combo_ask_size"})
