# Also record series that first appear in Kalshi's series list after
# the scanner's first snapshot, for new_series_days after they're seen,
# the most recent max_new_series of them.
include_new_series: true
new_series_days: 14
max_new_series: 100

# Subscribe this long before a market's open_time, and record until this
# long after it.
lead: 5s
window: 60s

# Series recorded for longer than `window` (longest matching prefix).
# On 2026-11-14 the one maker on the gas bucket markets quoted 5-6 min
# after the 13:00Z open, and some states first went two-sided at +20m,
# so a 60s capture held no orders at all. Only the recording is longer:
# rungs are still grouped into events over `window`, and the backfill's
# flow window stays `window`. 51 gas events hold a connection for 30m,
# well under max_concurrent.
series_windows:
  - {prefix: KXAAAGASCD, window: 30m}

# Captures running at once. A capture is one websocket connection
# covering all the rungs of one event that open together. An event past
# the cap is skipped whole and counted in opens_skipped_total.
#
# The width of an event doesn't count against this (the widest chosen
# ones are about 33 rungs, KXWTI, on one connection); how many events
# open at the same instant does. 50 of the chosen series' events open
# together at 15:00Z daily, so 100 leaves room for new series opening
# then too. With pmde's 4 connections that is 104 of the 200 Kalshi
# allows on the lower tiers.
#
# The gas events open together at 13:00Z: since 2026-11-15 the national
# ladder and the 50 state bucket markets, 51 captures (the bucket ones
# held 30m), 55 connections with pmde's 4. It fits; the cap was not
# raised.
max_concurrent: 100

# How often to poll the watched series' unopened markets, and the
# series list.
market_poll: 1m
series_poll: 15m

# What counts as a two-sided quote, everywhere: triage, backfill, report,
# the new-series alert and the bad-maker evaluation. A best bid and ask
# at most max_spread_bps apart, each with at least min_size contracts
# resting at its price; levels with less are passed over, so stubs and
# sub-contract orders never count. Candlesticks have no sizes, so quotes
# read from them are held to the spread cap only.
quote:
  max_spread_bps: 1000
  min_size: 10

# When pmde-opens badmakers (run daily after the backfill) flags a series
# as a bad-maker candidate, over the trailing window_days: a qualifying
# quote on at least min_quoted_share of captured opens; median daily
# capacity of at least min_median_capacity contracts; one size and spread
# combination on at least min_modal_share of opening quotes; at least
# min_events settled events; and evidence the quotes are wrong (net edge
# above zero with its lower bound above zero, or wing rungs settling
# against their opening price above the wing_interval interval). A series
# is notified at most once every notify_every_days.
bad_maker:
  window_days: 30
  min_quoted_share: 0.7
  min_median_capacity: 200
  min_modal_share: 0.7
  min_events: 30
  wing_interval: 0.9
  notify_every_days: 7
